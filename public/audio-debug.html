<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ente audio diagnostic</title>
<style>
  body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font: 16px system-ui; }
  audio { display: block; width: 100%; margin: 1rem 0; }
  button { padding: .6rem 1rem; font: inherit; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
</style>
<h1>Audio diagnostic</h1>
<p>Play each version separately. Both use the same song. Report which is audible and copy the diagnostic text below.</p>
<h2>Native playback</h2>
<audio id="native" controls preload="metadata" src="/tracks/then.mp3"></audio>
<h2>Web Audio playback</h2>
<button id="toggle">Play Web Audio</button>
<audio id="routed" preload="metadata" src="/tracks/then.mp3"></audio>
<pre id="status"></pre>
<pre id="events"></pre>
<script type="module">
  const native = document.querySelector('#native');
  const routed = document.querySelector('#routed');
  const status = document.querySelector('#status');
  const events = document.querySelector('#events');
  const toggle = document.querySelector('#toggle');
  const messages = [];
  let context;
  let analyser;
  let samples;

  try {
    context = new AudioContext();
    analyser = context.createAnalyser();
    analyser.fftSize = 256;
    samples = new Float32Array(analyser.fftSize);
    const gain = context.createGain();
    context.createMediaElementSource(routed).connect(gain).connect(analyser);
    analyser.connect(context.destination);
    context.addEventListener('statechange', () => log(`Context: ${context.state}`));
    context.addEventListener('error', () => log('AudioContext output error'));
    log(`Context created: ${context.state}`);
  } catch (error) {
    log(`Setup failed: ${error}`);
    toggle.disabled = true;
  }

  toggle.onclick = async () => {
    if (!routed.paused) return routed.pause();
    native.pause();
    try {
      log('Play requested');
      if (context.state === 'suspended') await context.resume();
      log(`Context ready: ${context.state}`);
      await routed.play();
      log('play() resolved');
    } catch (error) {
      log(`Playback failed: ${error}`);
    }
  };
  native.onplay = () => routed.pause();
  for (const audio of [native, routed]) {
    for (const event of ['loadedmetadata', 'playing', 'pause', 'waiting', 'stalled', 'seeking', 'seeked', 'ended', 'emptied', 'error']) {
      audio.addEventListener(event, () => {
        log(`${audio.id}: ${event} at ${audio.currentTime.toFixed(2)}s${audio.error ? ` — ${audio.error.code}: ${audio.error.message}` : ''}`);
        toggle.textContent = routed.paused ? 'Play Web Audio' : 'Pause Web Audio';
      });
    }
  }
  setInterval(() => {
    analyser?.getFloatTimeDomainData(samples);
    status.textContent = [
      navigator.userAgent,
      `Context: ${context?.state}, clock: ${context?.currentTime.toFixed(2)}s, sample rate: ${context?.sampleRate}`,
      `Signal peak: ${samples ? Math.max(...samples.map(Math.abs)).toFixed(5) : 'unavailable'}`,
      ...[native, routed].map(audio => `${audio.id}: ${audio.currentTime.toFixed(2)} / ${audio.duration.toFixed(2)}s, paused: ${audio.paused}, ready: ${audio.readyState}, volume: ${audio.volume}`),
    ].join('\n');
  }, 1000);

  function log(message) {
    messages.push(`${(performance.now() / 1000).toFixed(1)}s ${message}`);
    events.textContent = messages.slice(-40).join('\n');
  }
</script>
</html>
